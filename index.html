<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Mortal局面エディタ</title>
        <style>
            :root {
                --bg: #0b2c33;
                --fg: #e6f0ee;
                --mut: #8db2b0;
                --card: #103e47;
                --line: #2a6670;
                --ok: #5fd68a;
                --ng: #ff8274;
                --acc: #2f9e9a;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top,0px);
                padding-bottom: env(safe-area-inset-bottom,0px)
            }

            html,body {
                margin: 0
            }

            body {
                color: var(--fg);
                max-width: 1000px;
                margin: 0 auto;
                padding: 14px;
                font: 15px/1.6 Hiragino Sans,Yu Gothic,Meiryo,sans-serif
            }

            h1 {
                margin: 4px 0 12px;
                font-size: 19px
            }

            textarea {
                box-sizing: border-box;
                background: var(--card);
                width: 100%;
                height: 110px;
                color: var(--fg);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 8px;
                font: 12px monospace
            }

            button,select {
                font: inherit;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
                cursor: pointer;
                border-radius: 6px;
                padding: 6px 14px
            }

            button.pri {
                background: var(--acc);
                color: var(--bg);
                border-color: var(--acc);
                font-weight: 700
            }

            .row {
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                margin: 8px 0;
                display: flex
            }

            .mut {
                color: var(--mut);
                font-size: 13px
            }

            #pick[hidden] {
                visibility: hidden;
                display: flex
            }

            #pick {
                flex-wrap: nowrap
            }

            #seat {
                text-overflow: ellipsis;
                flex: 1 1 0;
                min-width: 0;
                max-width: 18em
            }

            #tmode {
                flex: none
            }

            #start {
                flex: none;
                min-width: 5.5em
            }

            .score {
                font-weight: 700
            }

            .t {
                color: #222;
                box-sizing: border-box;
                background: #fffdf3;
                border: 1px solid #9c967c;
                border-bottom: 4px solid #2f7d5b;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                width: 42px;
                height: 58px;
                margin: 1px;
                font-size: 27px;
                font-weight: 700;
                line-height: 1.05;
                display: inline-flex
            }

            .t i {
                font-size: 14px;
                font-style: normal;
                font-weight: 700
            }

            .t.m {
                color: #c4281c
            }

            .t.p {
                color: #1f55c4
            }

            .t.s2 {
                color: #16794a
            }

            .t.h {
                color: #222
            }

            .t.hg {
                color: #16794a
            }

            .t.hr {
                color: #c4281c
            }

            .t.rt {
                box-shadow: 0 0 0 2px #e0a800
            }

            .hand {
                align-items: flex-end;
                display: flex
            }

            .hand .t {
                cursor: pointer
            }

            .hand.lock .t {
                cursor: default
            }

            .hand .gap {
                width: 14px
            }

            .t.pick {
                outline: 3px solid var(--ng)
            }

            .t.act,.t.pick.act {
                outline: 3px solid var(--ok)
            }

            .res {
                min-height: 26px;
                margin: 6px 0;
                font-weight: 700
            }

            .res.ok {
                color: var(--ok)
            }

            .res.ng {
                color: var(--ng)
            }

            table {
                border-collapse: collapse;
                width: 100%
            }

            td,th {
                border-bottom: 1px solid var(--line);
                text-align: left;
                padding: 4px 6px
            }

            .wrap {
                grid-template-columns: auto 250px;
                justify-content: center;
                align-items: start;
                display: grid
            }

            @media (width<=900px) {
                .wrap {
                    grid-template-columns: 1fr
                }
            }

            .tb {
                --rw: 26px;
                --rh: 35px;
                --Hr: calc(3*(var(--rh) + 2px));
                flex-direction: column;
                align-items: center;
                display: flex;
                overflow: hidden
            }

            .t.s {
                width: var(--rw,28px);
                height: var(--rh,38px);
                font-size: calc(var(--rw,28px)*.65);
                border-bottom-width: 3px
            }

            .t.s i {
                font-size: calc(var(--rw,28px)*.36)
            }

            .top,.mid,.mine {
                align-items: center;
                gap: 8px;
                display: flex
            }

            .mine {
                justify-content: center;
                align-items: flex-end
            }

            .cen {
                grid-template-columns: var(--Hr) var(--Wr) var(--Hr);
                grid-template-rows: var(--Hr) var(--Wr) var(--Hr);
                padding: 4px;
                display: grid
            }

            .rv {
                width: var(--Wr);
                height: var(--Hr);
                flex-flow: column;
                align-items: flex-start;
                display: flex
            }

            .rv .rr {
                height: calc(var(--rh) + 2px);
                flex-wrap: nowrap;
                flex: none;
                align-items: flex-end;
                display: flex
            }

            .rv .rr>* {
                flex: none
            }

            .r2 {
                grid-area: 1/2
            }

            .r2 .rv {
                transform: rotate(180deg)
            }

            .r0 {
                grid-area: 3/2
            }

            .r3 {
                grid-area: 2/1;
                position: relative
            }

            .r3 .rv {
                transform-origin: 0 0;
                transform: translate(var(--Hr),0) rotate(90deg);
                position: absolute;
                top: 0;
                left: 0
            }

            .r1 {
                grid-area: 2/3;
                position: relative
            }

            .r1 .rv {
                transform-origin: 0 0;
                transform: translate(0,var(--Wr)) rotate(-90deg);
                position: absolute;
                top: 0;
                left: 0
            }

            .ci {
                text-align: center;
                grid-area: 2/2;
                justify-content: center;
                align-items: center;
                font-size: 12px;
                line-height: 1.4;
                display: flex;
                position: relative
            }

            .sc {
                white-space: nowrap;
                line-height: 1.2;
                position: absolute
            }

            .sc.st {
                left: 50%;
                transform: translate(-50%)rotate(180deg)
            }

            .sc.sb {
                left: 50%;
                transform: translate(-50%)
            }

            .sc.sl,.sc.sr {
                top: 50%
            }

            .bk {
                box-sizing: border-box;
                width: 16px;
                height: 24px;
                display: inline-block
            }

            .bkc {
                flex-direction: column;
                gap: 1px;
                display: flex
            }

            .bkr {
                gap: 1px;
                display: flex
            }

            .side2 {
                flex-direction: column;
                align-items: center;
                gap: 6px;
                display: flex
            }

            .ml {
                flex-wrap: wrap;
                gap: 4px;
                display: flex
            }

            .ml span {
                display: inline-flex
            }

            .side2 .ml {
                flex-direction: column
            }

            .hand {
                margin: 0
            }

            .hc {
                flex-direction: column;
                align-items: center;
                display: inline-flex
            }

            .rv .t.act {
                outline: 3px solid #35b150
            }

            .pn {
                margin-bottom: 8px;
                padding: 10px
            }

            .t.red {
                border: 1px solid #9c967c;
                border-bottom: 4px solid #2f7d5b
            }

            .t.s.red {
                border-bottom-width: 3px
            }

            .tb {
                justify-self: center
            }

            .t svg {
                width: 86%;
                height: 86%;
                display: block
            }

            .t b,.t i {
                font-family: Hiragino Mincho ProN,Yu Mincho,Noto Serif JP,serif
            }

            .t.m i {
                color: #222
            }

            .t {
                position: relative
            }

            .t .im {
                object-fit: fill;
                width: 100%;
                height: 100%;
                display: block;
                position: absolute;
                top: 0;
                left: 0
            }

            .t.ok,.t.ok.red {
                background: #fffdf3
            }

            body {
                background: #141414
            }

            .mid {
                border: 1px solid #0006;
                padding: 10px;
                box-shadow: inset 0 0 0 6px #ffffff08,0 0 0 7px #0000002e
            }

            .cen {
                background: #0a1f24
            }

            .ci {
                color: #e8f0ee
            }

            .ci b {
                color: #fff;
                letter-spacing: .05em;
                font-family: Hiragino Mincho ProN,Yu Mincho,serif
            }

            .bk {
                background: linear-gradient(#d8ab2b 0 66%,#efeadb 66%);
                border: 1px solid #8f6d12;
                border-radius: 3px
            }

            .bkc .bk {
                background: linear-gradient(90deg,#d8ab2b 0 66%,#efeadb 66%)
            }

            #bk3 .bk {
                background: linear-gradient(90deg,#efeadb 0 34%,#d8ab2b 34%)
            }

            .bkr .bk {
                background: linear-gradient(#efeadb 0 34%,#d8ab2b 34%)
            }

            .t,.t.red {
                border-bottom-color: #c79a1f
            }

            .pn {
                color: #fff;
                background: linear-gradient(#8a2c14,#5e1b0b);
                border: 1px solid #3a0f06;
                border-radius: 2px
            }

            .pn button {
                color: #fff;
                background: linear-gradient(#a8421f,#701f0d);
                border: 1px solid #2e0c04;
                border-radius: 2px;
                padding: 8px 18px;
                font-size: 16px
            }

            .pn button.pri {
                color: #1a1205;
                background: linear-gradient(#e8b43a,#a8741a);
                border-color: #4a3208
            }

            .tb {
                isolation: isolate;
                transform-origin: 50% 100%;
                background: radial-gradient(at 50% 45%,#1a8590 0%,#0f6470 55%,#093f48 100%) padding-box padding-box,linear-gradient(135deg,#f27a3c,#b9411a 35%,#e8693a 60%,#8d2b10) border-box;
                border: 18px solid #0000;
                border-image: ;
                border-radius: 16px;
                gap: 10px;
                padding: 14px
            }

            .mid {
                gap: 10px
            }

            .tb {
                --rw: 30px;
                --rh: 41px
            }

            .bk {
                width: 20px;
                height: 30px
            }

            .bkc .bk {
                width: 30px;
                height: 18px
            }

            .mine .hand .t {
                height: 63px
            }

            .t {
                border-radius: 4px;
                box-shadow: 0 2px 3px #00000073
            }

            .ci {
                --bar: inset 0 -5px 0 #2fb84a;
                box-shadow: var(--bar),inset 0 0 26px #000000d9;
                background: radial-gradient(circle at 50% 45%,#3a4549 0%,#1a2225 70%,#0c1214 100%);
                border: 2px solid #000;
                transition: box-shadow .2s
            }

            .ci[data-turn="1"] {
                --bar: inset -5px 0 0 #2fb84a
            }

            .ci[data-turn="2"] {
                --bar: inset 0 5px 0 #2fb84a
            }

            .ci[data-turn="3"] {
                --bar: inset 5px 0 0 #2fb84a
            }

            .ctr {
                flex-direction: column;
                align-items: center;
                gap: 3px;
                display: flex
            }

            .ci b {
                font-size: 26px;
                line-height: 1.15
            }

            .sub {
                color: #e4eeec;
                white-space: nowrap;
                font-size: 14px
            }

            .stk {
                vertical-align: middle;
                background: #f2f2f2;
                border: 1px solid #888;
                border-radius: 2px;
                width: 16px;
                height: 6px;
                margin: 0 4px 0 10px;
                display: inline-block
            }

            .stk.h {
                background: radial-gradient(circle,#222 0 1px,#0000 1.5px) 0 0/4px 100%,#f2f2f2
            }

            .stk.r {
                background: radial-gradient(circle,#d22 0 2px,#0000 2.5px),#f2f2f2
            }

            .dr {
                gap: 2px;
                display: flex
            }

            .sc {
                color: #f1f6f4;
                text-shadow: 0 1px 2px #000;
                font-family: Hiragino Mincho ProN,Yu Mincho,serif;
                font-size: 14px
            }

            .sc.sl {
                transform: translate(-50%,-50%)rotate(90deg)
            }

            .sc.sr {
                transform: translate(50%,-50%)rotate(-90deg)
            }

            .dlt {
                white-space: nowrap;
                margin-left: 7px;
                display: inline-block
            }

            .dlt.dlt-z {
                text-shadow: 0 1px 2px #000
            }

            .mg {
                --W: calc(var(--nn)*(var(--rw) + 2px) + var(--rr)*(var(--rh) + 2px));
                --H: max(calc(var(--rh) + 2px),calc(var(--st)*(2*var(--rw) + 4px)));
                width: var(--W);
                height: var(--H);
                position: relative
            }

            .ml .mg {
                display: block
            }

            .mi {
                width: var(--W);
                height: var(--H);
                align-items: flex-end;
                display: flex;
                position: absolute;
                top: 0;
                left: 0
            }

            .ml .mi,.ml .rg {
                display: flex
            }

            .rg {
                flex-direction: column
            }

            .ml .rot {
                width: calc(var(--rh) + 2px);
                height: calc(var(--rw) + 2px);
                display: block;
                position: relative
            }

            .rot .t {
                transform-origin: 0 0;
                transform: translate(var(--rh),0) rotate(90deg);
                position: absolute;
                top: 0;
                left: 0
            }

            .rot.n .t {
                transform: translate(0,var(--rw)) rotate(-90deg)
            }

            .t.s.dn {
                background: linear-gradient(#e6bb3e,#c79a1f);
                border-color: #8a6a14
            }

            .g2 .mi {
                transform: rotate(180deg)
            }

            .g1 {
                width: var(--H);
                height: var(--W)
            }

            .g1 .mi {
                transform-origin: 0 0;
                transform: translate(0,var(--W)) rotate(-90deg)
            }

            .g3 {
                width: var(--H);
                height: var(--W)
            }

            .g3 .mi {
                transform-origin: 0 0;
                transform: translate(var(--H),0) rotate(90deg)
            }

            #quiz.dimon .t.dim {
                filter: brightness(.8)
            }

            .tb {
                --Wr: calc(6*(var(--rw) + 2px) + var(--rh) - var(--rw) + 1px)
            }

            .rv .rot {
                width: calc(var(--rh) + 2px);
                height: calc(var(--rw) + 2px);
                align-self: flex-end;
                display: block;
                position: relative
            }

            .sc .hi {
                color: #fff;
                margin-left: 1px;
                font-size: 1.5em;
                font-weight: 700
            }

            .sc .lo {
                opacity: .7
            }

            .sc .wn {
                opacity: .55;
                font-size: 1.5em
            }

            .hand {
                position: relative
            }

            .cbtn {
                z-index: 5;
                white-space: nowrap;
                position: absolute;
                bottom: 100%;
                right: 0
            }

            .cbtn .row {
                flex-wrap: nowrap;
                margin: 0
            }

            .cbtn button.pri {
                color: #1a1205;
                background: linear-gradient(#e8b43a,#a8741a);
                border: 1px solid #4a3208;
                border-radius: 3px;
                font-weight: 700;
                box-shadow: 0 2px 4px #0009
            }

            .tm {
                margin-top: 6px;
                font-size: 13px
            }

            #tbk {
                background: #e8b43a
            }

            input[type=number] {
                background: var(--card);
                color: var(--fg);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 4px
            }

            .tmv {
                text-align: center;
                color: #fff;
                pointer-events: none;
                white-space: nowrap;
                text-shadow: -1px -1px #000,1px -1px #000,-1px 1px #000,1px 1px #000,0 0 3px #000;
                font: 700 16px/1 system-ui,sans-serif;
                position: absolute
            }

            .tmv.w {
                color: #ff7a6b
            }

            .hand .t.pick,.hand .t.act {
                z-index: 1
            }

            .hand .t.pick {
                outline: 4px solid var(--ng);
                outline-offset: -1px;
                box-shadow: 0 0 0 3px #b8352b59,0 0 12px 2px #b8352b8c
            }

            .hand .t.act {
                outline: 4px solid var(--ok);
                outline-offset: -1px;
                box-shadow: 0 0 0 3px #16794a59,0 0 12px 2px #16794a8c
            }

            .hand .t.pick.act {
                outline: 4px solid var(--ok)
            }

            .hand .t.pick:after,.hand .t.act:after {
                color: #fff;
                white-space: nowrap;
                pointer-events: none;
                border-radius: 8px;
                font: 700 10px/14px system-ui,sans-serif;
                position: absolute;
                left: 50%;
                transform: translate(-50%)
            }

            .hand .t.pick:after {
                content: "あなた";
                background: var(--ng)
            }

            .hand .t.act:after {
                content: "牌譜";
                background: var(--ok)
            }

            .hand .t.pick.act:after {
                content: "一致";
                background: var(--ok)
            }

            .hand {
                padding-top: 10px
            }

            button.pri.act {
                color: #fff!important;

                border-color: #0d4a2c!important;

            }

            button.pri.pick:not(.act) {

            }

        <script>
            const $ = s => document.querySelector(s);
            const WD = ['東', '南', '西', '北']
              , REL = ['自分', '下家', '対面', '上家'];
            const tp = v => v >= 51 ? (v - 51) * 9 + 4 : (Math.floor(v / 10) - 1) * 9 + v % 10 - 1;
            const isRed = v => v >= 51;
            const nm = v => {
                const t = tp(v);
                if (t >= 27)
                    return '東南西北白發中'[t - 27];
                return (isRed(v) ? '赤5' : (t % 9 + 1)) + 'mps'[Math.floor(t / 9)];
            }
            ;
            const esc = s => String(s).replace(/[&<>"]/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;'
            }[c]));

            function tile(v, small, cls, attr) {
                const a = tp(v)
                  , red = isRed(v);
                const c = a < 9 ? 'm' : a < 18 ? 'p' : a < 27 ? 's2' : a == 32 ? 'hg' : a == 33 ? 'hr' : 'h';
                const img = a < 27 ? ['Man', 'Pin', 'Sou'][Math.floor(a / 9)] + (a % 9 + 1) + (red ? '-Dora' : '') : ['Ton', 'Nan', 'Shaa', 'Pei', 'Haku', 'Hatsu', 'Chun'][a - 27];
                return `<span class="t ${small ? 's' : ''} ${c} ${red ? 'red' : ''} ok ${cls || ''}" ${attr || ''}><span class="im i-${img}"></span></span>`;
            }

            /* ---------- 状態 ---------- */
            let MYSEAT = 0
              , OBJ = null
              , ORIG_TEXT = ''
              , KI = 0
              , K = null
              , META = null
              , SIM = null
              , me = 0
              , myPts = []
              , pi = 0
              , sel = null;

            /* ---------- 牌譜の解析・シミュレーション ---------- */
            function parseStr(x) {
                const toks = String(x).match(/[a-z]|\d{2}/g) || [];
                const tiles = [];
                let L = null
                  , pos = 0;
                for (const t of toks) {
                    if (/[a-z]/.test(t)) {
                        if (!L) {
                            L = t;
                            pos = tiles.length;
                        }
                    } else
                        tiles.push(+t);
                }
                return {
                    L,
                    tiles,
                    pos
                };
            }
            function parseDi(x) {
                if (typeof x === 'number')
                    return {
                        r: false,
                        t: x
                    };
                if (typeof x === 'string') {
                    const m = x.match(/^r(\d+)$/);
                    if (m)
                        return {
                            r: true,
                            t: +m[1]
                        };
                    return {
                        s: x
                    };
                }
                return null;
            }
            function dirOf(c) {
                if (c.L === 'c')
                    return 3;
                if (c.L === 'p')
                    return [3, 2, 1][Math.min(c.pos, 2)];
                return c.pos === 0 ? 3 : (c.pos >= 3 ? 1 : 2);
            }
            function pickHand(p, v) {
                const h = p.hand;
                let k = h.findIndex(i => i.v === v);
                if (k < 0) {
                    const t = tp(v);
                    k = h.findIndex(i => tp(i.v) === t);
                }
                if (k < 0)
                    return {
                        v,
                        o: null,
                        d: null,
                        ph: 1
                    };
                return h.splice(k, 1)[0];
            }
            function simulate() {
                const oya = K[0][0] % 4;
                const P = [0, 1, 2, 3].map(q => {
                    const hai = K[4 + 3 * q]
                      , dr = K[5 + 3 * q]
                      , di = K[6 + 3 * q];
                    return {
                        q,
                        hai,
                        dr,
                        di,
                        hand: hai.map( (v, i) => ({
                            v,
                            o: {
                                arr: hai,
                                i
                            },
                            d: null
                        })),
                        melds: [],
                        river: [],
                        ptr: 0,
                        last: null
                    };
                }
                );
                let seq = 0
                  , actor = oya
                  , draws = 0
                  , guard = 0;
                const points = []
                  , kanSeq = [];
                while (guard++ < 3000) {
                    const p = P[actor];
                    if (p.ptr >= p.dr.length)
                        break;
                    const e = p.dr[p.ptr];
                    let drawInst = null
                      , callL = null;
                    seq++;
                    if (typeof e === 'number') {
                        drawInst = {
                            v: e,
                            o: {
                                arr: p.dr,
                                i: p.ptr
                            },
                            d: null
                        };
                        p.hand.push(drawInst);
                        draws++;
                    } else {
                        const c = parseStr(e);
                        callL = c.L;
                        const dir = dirOf(c)
                          , src = (actor + dir) % 4
                          , sp = P[src];
                        let ent = sp.river[sp.river.length - 1] || null;
                        if (ent && ent.calledSeq !== Infinity)
                            ent = null;
                        if (ent)
                            ent.calledSeq = seq;
                        const own = c.tiles.filter( (_, k) => k !== c.pos).map(v => pickHand(p, v));
                        p.melds.push({
                            owner: actor,
                            type: c.L,
                            own,
                            called: ent || {
                                inst: {
                                    v: c.tiles[c.pos]
                                }
                            },
                            dir,
                            seq,
                            kakan: null,
                            kakanSeq: Infinity
                        });
                        if (c.L === 'm')
                            kanSeq.push(seq);
                    }
                    p.last = drawInst;
                    const raw = p.di[p.ptr]
                      , dd = parseDi(raw);
                    if (dd && !dd.s && dd.t > 0) {
                        points.push({
                            p: actor,
                            ptr: p.ptr,
                            seq,
                            hand: p.hand.slice(),
                            draw: drawInst,
                            melds: P.map(q => q.melds.slice()),
                            dc: P.map(q => q.river.length),
                            pc: P.map(q => q.ptr),
                            dn: Math.min(1 + kanSeq.length, 5),
                            draws,
                            raw,
                            callL
                        });
                    }
                    let stay = false;
                    if (!dd)
                        break;
                    if (dd.s) {
                        const c = parseStr(dd.s);
                        if (c.L === 'a') {
                            const own = c.tiles.map(v => pickHand(p, v));
                            seq++;
                            p.melds.push({
                                owner: actor,
                                type: 'a',
                                own,
                                called: null,
                                dir: 0,
                                seq,
                                kakan: null,
                                kakanSeq: Infinity
                            });
                            kanSeq.push(seq);
                        } else if (c.L === 'k') {
                            const t = tp(c.tiles[0]);
                            const m = p.melds.find(m => m.type === 'p' && tp(m.own[0].v) === t);
                            const inst = pickHand(p, c.tiles[c.tiles.length - 1]);
                            seq++;
                            if (m) {
                                m.kakan = inst;
                                m.kakanSeq = seq;
                                m.type = 'k';
                            }
                            kanSeq.push(seq);
                        }
                        stay = true;
                    } else if (dd.t === 0) {
                        stay = (callL === 'm');
                    } else {
                        let inst;
                        if (dd.t === 60) {
                            inst = p.last;
                            if (inst) {
                                const k = p.hand.indexOf(inst);
                                if (k >= 0)
                                    p.hand.splice(k, 1);
                            } else
                                inst = p.hand.pop() || {
                                    v: 41,
                                    o: null,
                                    d: null,
                                    ph: 1
                                };
                        } else
                            inst = pickHand(p, dd.t);
                        const ent = {
                            arr: p.di,
                            i: p.ptr,
                            num: dd.t !== 60,
                            r: dd.r,
                            inst,
                            p: actor,
                            calledSeq: Infinity
                        };
                        inst.d = ent;
                        p.river.push(ent);
                    }
                    p.ptr++;
                    if (stay)
                        continue;
                    let nxt = (actor + 1) % 4
                      , found = false;
                    for (const pass of [0, 1]) {
                        for (let d = 1; d < 4 && !found; d++) {
                            const q = (actor + d) % 4
                              , eq = P[q].dr[P[q].ptr];
                            if (typeof eq === 'string') {
                                const c = parseStr(eq);
                                const ok = pass === 0 ? (c.L === 'p' || c.L === 'm') : c.L === 'c';
                                if (ok && (q + dirOf(c)) % 4 === actor) {
                                    nxt = q;
                                    found = true;
                                }
                            }
                        }
                    }
                    actor = nxt;
                }
                SIM = {
                    P,
                    points
                };
            }

            /* ---------- 値の書き換え ---------- */
            function writeEntry(d) {
                const base = d.num ? d.inst.v : 60;
                d.arr[d.i] = d.r ? 'r' + base : base;
            }
            function setInst(inst, v) {
                inst.v = v;
                if (inst.o)
                    inst.o.arr[inst.o.i] = v;
                const d = inst.d;
                if (d) {
                    if (!d.num && !inst.o)
                        d.num = true;
                    if (d.num)
                        writeEntry(d);
                }
            }
            function toggleRiichi(ent) {
                const on = !ent.r;
                if (on) {
                    SIM.P[ent.p].river.forEach(x => {
                        if (x.r) {
                            x.r = false;
                            writeEntry(x);
                        }
                    }
                    );
                }
                ent.r = on;
                writeEntry(ent);
            }

            /* ---------- 局面ごとの計算 ---------- */
            const cur = () => myPts[pi] || null;
            function shownRiver(q, pt) {
                return SIM.P[q].river.slice(0, pt.dc[q]);
            }
            function riichiCount(q, pt) {
                return shownRiver(q, pt).some(e => e.r) ? 1 : 0;
            }
            function visibleMelds(q, pt) {
                return pt.melds[q].filter(m => m.seq <= pt.seq);
            }
            function countTiles(pt) {
                const cnt = new Array(34).fill(0)
                  , red = {
                    51: 0,
                    52: 0,
                    53: 0
                };
                const add = v => {
                    cnt[tp(v)]++;
                    if (isRed(v))
                        red[v]++;
                }
                ;
                pt.hand.forEach(i => add(i.v));
                for (let q = 0; q < 4; q++) {
                    shownRiver(q, pt).forEach(e => add(e.inst.v));
                    visibleMelds(q, pt).forEach(m => {
                        m.own.forEach(i => add(i.v));
                        if (m.kakan && m.kakanSeq <= pt.seq)
                            add(m.kakan.v);
                    }
                    );
                }
                K[2].slice(0, pt.dn).forEach(add);
                return {
                    cnt,
                    red
                };
            }

            /* ---------- 描画: 盤面 ---------- */
            function meldHTML(m, n, S) {
                const r = v => tile(v, 1);
                let l, nn, rr, st = 0;
                if (!m.called) {
                    l = m.own.map( (x, e) => e % 3 ? r(x.v) : '<span class="t s dn"></span>');
                    nn = 4;
                    rr = 0;
                } else {
                    const i = m.dir
                      , nc = i === 1 ? ' n' : '';
                    const hasK = m.kakan && m.kakanSeq <= S;
                    const grp = `<span class="rg">${hasK ? `<span class="rot${nc}">${r(m.kakan.v)}</span>` : ''}<span class="rot${nc}">${r(m.called.inst.v)}</span></span>`;
                    l = m.own.map(x => r(x.v));
                    l.splice(i === 3 ? 0 : i === 2 ? 1 : l.length, 0, grp);
                    nn = m.own.length;
                    rr = 1;
                    st = hasK ? 1 : 0;
                }
                return `<span class="mg g${n}" style="--nn:${nn};--rr:${rr};--st:${st}"><span class="mi">${l.join('')}</span></span>`;
            }
            function renderBoard() {
                const pt = cur()
                  , B = $('#board');
                if (!pt) {
                    B.innerHTML = '<div class="mut">この視点には、打牌を選ぶ局面がありません。</div>';
                    return;
                }
                const S = pt.seq
                  , Lq = n => (me + n) % 4
                  , oya = K[0][0] % 4;
                const isSel = (k, o) => sel && sel.k === k && ((k === 'h' && sel.inst === o) || (k === 'r' && sel.e === o) || (k === 'd' && sel.i === o));
                const rv = n => {
                    const q = Lq(n)
                      , items = [];
                    let any = false;
                    shownRiver(q, pt).forEach( (e, j) => {
                        if (e.calledSeq <= S)
                            return;
                        let h = tile(e.inst.v, 1, isSel('r', e) ? 'sel' : '', `data-k="r" data-q="${q}" data-j="${j}"`);
                        if (e.r) {
                            any = true;
                            h = `<span class="rot n">${h}</span>`;
                        }
                        items.push(h);
                    }
                    );
                    const rows = [items.slice(0, 6), items.slice(6, 12), items.slice(12)];
                    return `<div class="rv${any ? ' hr' : ''}">${rows.map(x => `<div class="rr">${x.join('')}</div>`).join('')}</div>`;
                }
                ;
                const kt = n => `<div class="ml">${visibleMelds(Lq(n), pt).map(m => meldHTML(m, n, S)).join('')}</div>`;
                const bt = n => '<span class="bk"></span>'.repeat(Math.max(0, 13 - 3 * visibleMelds(Lq(n), pt).length));
                const dt = n => {
                    const q = Lq(n)
                      , a = K[1][q] - 1000 * riichiCount(q, pt)
                      , o = Math.abs(a)
                      , i = (q - oya + 4) % 4;
                    return `${i ? '<span class="wn">' + WD[i] + '</span>' : '<span class="hi">東</span>'} ${a < 0 ? '-' : ''}<span class="hi">${Math.floor(o / 100)}</span><span class="lo">${String(o % 100).padStart(2, '0')}</span>`;
                }
                ;
                const hl = pt.hand.filter(i => i !== pt.draw).sort( (a, b) => (tp(a.v) * 2 + (isRed(a.v) ? 0 : 1)) - (tp(b.v) * 2 + (isRed(b.v) ? 0 : 1)));
                const hand = hl.map(i => tile(i.v, 0, isSel('h', i) ? 'sel' : '', `data-k="h" data-n="${pt.hand.indexOf(i)}"`)).join('') + '<span class="gap"></span>' + (pt.draw ? tile(pt.draw.v, 0, 'drw ' + (isSel('h', pt.draw) ? 'sel' : ''), `data-k="h" data-n="${pt.hand.indexOf(pt.draw)}"`) : '<span class="hph"></span>');
                const dora = [0, 1, 2, 3, 4].map(e => e < pt.dn ? tile(K[2][e], 1, isSel('d', e) ? 'sel' : '', `data-k="d" data-i="${e}"`) : '<span class="dwb"></span>').join('');
                const kyo = K[0][0]
                  , label = WD[Math.floor(kyo / 4)] + (kyo % 4 + 1) + '局';
                const takes = pt.draws - pt.dn + 1;
                const rem = Math.max(0, 70 - takes);
                B.innerHTML = `<div class="tb">
  <div class="top">${kt(2)}<div class="bkr">${bt(2)}</div></div>
  <div class="mid"><div class="side2">${kt(3)}<div class="bkc" id="bk3">${bt(3)}</div></div>
   <div class="cen"><div class="r2">${rv(2)}</div><div class="r3">${rv(3)}</div>
    <div class="ci" data-turn="0"><div class="sc st">${dt(2)}</div><div class="sc sl">${dt(3)}</div><div class="sc sr">${dt(1)}</div><div class="sc sb">${dt(0)}</div>
     <div class="ctr"><b>${label.replace('局', '<span class="kk">局</span>')}</b><div class="sub"><span>${rem}</span><i class="stk h"></i>${K[0][1]}<i class="stk r"></i>${K[0][2]}</div></div><div class="dw">${dora}</div></div>
    <div class="r1">${rv(1)}</div><div class="r0">${rv(0)}</div></div>
   <div class="side2">${kt(1)}<div class="bkc" id="bk1">${bt(1)}</div></div></div>
  <div class="mine"><div class="hand" id="hand">${hand}</div>${kt(0)}</div></div>`;
                fit();
            }
            function fit() {
                const tb = $('#board .tb');
                if (!tb)
                    return;
                const sx = window.scrollX
                  , sy = window.scrollY;
                $('#board').style.zoom = 1;
                const w = tb.offsetWidth
                  , avail = document.documentElement.clientWidth - 28;
                $('#board').style.zoom = w > 0 ? Math.min(1, avail / w) : 1;
                window.scrollTo(sx, sy);
            }
            window.addEventListener('resize', fit);

            /* ---------- 描画: パネル ---------- */
            function ptLabel(pt) {
                return `${pt.ptr + 1}巡目`;
            }
            function renderSeats() {
                if (!$('#seats'))
                    return;
                const oya = K[0][0] % 4
                  , nameOf = q => (META.name && META.name[q]) || ('席' + q);
                $('#seats').innerHTML = `<span class="mut2">視点: ${WD[(me - oya + 4) % 4]}家</span>`;
            }
            function renderPts() {
                const s = $('#psel');
                s.innerHTML = myPts.length ? myPts.map( (p, i) => `<option value="${i}">${esc(ptLabel(p))}</option>`).join('') : '<option>（局面なし）</option>';
                s.value = pi;
            }
            function renderScoresUI() {
                const pt = cur();
                $('#ksel2').innerHTML = Array.from({
                    length: 12
                }, (_, k) => `<option value="${k}">${WD[Math.floor(k / 4)]}${k % 4 + 1}局</option>`).join('');
                $('#ksel2').value = K[0][0];
                $('#honba').value = K[0][1];
                $('#kyotaku').value = K[0][2];
                const nameOf = q => (META.name && META.name[q]) || ('席' + q);
                const oya = K[0][0] % 4;
                $('#scores').innerHTML = pt ? [0, 1, 2, 3].map(n => {
                    const q = (me + n) % 4;
                    return `<span>${REL[n]}（${WD[(q - oya + 4) % 4]}）</span><span><input type="number" step="1" data-q="${q}" value="${Math.round((K[1][q] - 1000 * riichiCount(q, pt)) / 100)}">00</span>`;
                }
                ).join('') : '';
            }
            function renderPal() {
                const P = $('#pal')
                  , pt = cur();
                if (!sel || !pt) {
                    P.hidden = true;
                    P.innerHTML = '';
                    return;
                }
                const {cnt, red} = countTiles(pt);
                let curV, desc;
                if (sel.k === 'h') {
                    curV = sel.inst.v;
                    desc = '手牌';
                } else if (sel.k === 'r') {
                    curV = sel.e.inst.v;
                    desc = WD[(sel.q - K[0][0] % 4 + 4) % 4] + '家の河';
                } else {
                    curV = K[2][sel.i];
                    desc = 'ドラ表示牌' + (sel.i + 1);
                }
                const btn = v => {
                    const t = tp(v)
                      , left = isRed(v) ? 1 - red[v] : 4 - cnt[t];
                    return `<button class="pb${left <= 0 ? ' zero' : ''}${v === curV ? ' cur' : ''}" data-v="${v}">${tile(v, 1)}<span class="cn">${isRed(v) ? '赤' : ''}残${Math.max(left, 0)}</span></button>`;
                }
                ;
                const row = a => `<div class="palrow">${a.map(btn).join('')}</div>`;
                const rng = (s) => Array.from({
                    length: 9
                }, (_, i) => (s + 1) * 10 + i + 1);
                let h = `<div class="mut2" style="margin-bottom:4px">選択中: ${desc}（${nm(curV)}）→ 変更先をクリック</div>`;
                h += row(rng(0)) + row(rng(1)) + row(rng(2)) + row([41, 42, 43, 44, 45, 46, 47]) + row([51, 52, 53]);
                if (sel.k === 'r')
                    h += `<div class="row"><button id="rtog" class="${sel.e.r ? 'pri on' : ''}">リーチ宣言牌：${sel.e.r ? 'ON' : 'OFF'}</button></div>`;
                h += `<div class="row"><button id="cancelsel">選択解除</button></div>`;
                P.innerHTML = h;
                P.hidden = false;
                placePal();
            }
            function placePal() {
                const P = $('#pal');
                if (!sel || P.hidden)
                    return;
                const el = document.querySelector('#board .t.sel');
                if (!el) {
                    P.hidden = true;
                    return;
                }
                const r0 = el.getBoundingClientRect();
                /* 手牌のホバーで浮いている分(translate)を除いた位置を基準にする */
                const ty = (parseFloat((getComputedStyle(el).translate || '').split(' ')[1]) || 0) * (parseFloat($('#board').style.zoom) || 1);
                const r = {
                    left: r0.left,
                    width: r0.width,
                    top: r0.top - ty,
                    bottom: r0.bottom - ty
                }
                  , vw = document.documentElement.clientWidth
                  , vh = window.innerHeight
                  , m = 8;
                /* ページ座標で配置する(position:absolute)。牌と一緒にスクロールするので位置関係が常に固定される */
                const sx = window.scrollX
                  , sy = window.scrollY;
                P.style.maxHeight = 'none';
                const w = P.offsetWidth
                  , h = P.offsetHeight;
                let x = r.left + sx + r.width / 2 - w / 2;
                x = Math.max(m, Math.min(x, sx + vw - w - m));
                let y = r.top + sy - 6 - h;
                if (y < m)
                    y = r.bottom + sy + 6;
                P.style.left = x + 'px';
                P.style.top = y + 'px';
            }
            function scoreTotal() {
                return K[1].reduce( (a, b) => a + (+b || 0), 0) + 1000 * (K[0][2] || 0);
            }
            function scoreOk() {
                return !!K && scoreTotal() === 100000;
            }
            function renderWarn() {
                const pt = cur()
                  , w = $('#warn');
                if (!pt) {
                    w.innerHTML = '';
                    return;
                }
                const {cnt, red} = countTiles(pt)
                  , out = [];
                if (!scoreOk())
                    out.push(`合計点が${scoreTotal()}点です（供託込みで100000点にしてください）`);
                $('#copy').disabled = !scoreOk();
                cnt.forEach( (c, t) => {
                    if (c > 4)
                        out.push(`${nm(mk(t))}が${c}枚見えています（4枚まで）`);
                }
                );
                Object.keys(red).forEach(v => {
                    if (red[v] > 1)
                        out.push(`${nm(+v)}が${red[v]}枚あります`);
                }
                );
                for (let q = 0; q < 4; q++) {
                    if (shownRiver(q, pt).filter(e => e.r).length > 1)
                        out.push(`${WD[(q - K[0][0] % 4 + 4) % 4]}家のリーチ宣言牌が複数あります`);
                }
                w.innerHTML = out.map(x => `<div>⚠ ${esc(x)}</div>`).join('');
            }
            const mk = (t, red) => red ? 51 + Math.floor(t / 9) : (Math.floor(t / 9) + 1) * 10 + t % 9 + 1;

            /* ---------- 出力 ---------- */
            function buildExport() {
                const pt = cur();
                if (!pt)
                    return '';
                const k = JSON.parse(JSON.stringify(K));
                while (k[2].length < pt.dn)
                    k[2].push(41);
                k[2] = k[2].slice(0, pt.dn);
                for (let q = 0; q < 4; q++) {
                    const cnt = q === pt.p ? pt.ptr + 1 : pt.pc[q];
                    k[5 + 3 * q] = k[5 + 3 * q].slice(0, cnt);
                    k[6 + 3 * q] = k[6 + 3 * q].slice(0, cnt);
                }
                k.length = 16;
                k[16] = ['流局', [0, 0, 0, 0]];
                const o = {};
                for (const key of Object.keys(OBJ))
                    o[key] = key === 'log' ? [k] : META[key];
                if (!('log' in o))
                    o.log = [k];
                return JSON.stringify(o);
            }
            function renderSeatInfo() {
                const el = $('#seatinfo');
                if (!el)
                    return;
                if (!K) {
                    el.innerHTML = '';
                    return;
                }
                el.innerHTML = `Mortalの席指定：東1局で <b>${WD[me]}家</b>`;
            }
            function renderOut() {
                renderWarn();
                renderSeatInfo();
            }
            function renderAll() {
                renderBoard();
                renderPal();
                renderOut();
            }
            function renderStructure() {
                renderSeats();
                renderPts();
                renderScoresUI();
                renderAll();
            }

            /* ---------- 読み込み ---------- */
            function parseInput(text) {
                let t = text.trim();
                const m = t.match(/json=([^&\s]+)/);
                if (m) {
                    try {
                        t = decodeURIComponent(m[1]);
                    } catch (e) {}
                }
                return JSON.parse(t);
            }
            function loadText() {
                const msg = $('#msg');
                try {
                    OBJ = parseInput($('#src').value);
                    if (!OBJ || !Array.isArray(OBJ.log) || !OBJ.log.length)
                        throw new Error('log がありません');
                } catch (e) {
                    msg.textContent = '読み込めませんでした: ' + e.message;
                    return;
                }
                msg.textContent = '';
                ORIG_TEXT = $('#src').value;
                MYSEAT = ((OBJ.log[0][0][0] % 4) + (+(document.querySelector('input[name=mywind]:checked') || {
                    value: 0
                }).value)) % 4;
                const ks = $('#ksel');
                ks.innerHTML = OBJ.log.map( (l, i) => `<option value="${i}">${WD[Math.floor(l[0][0] / 4)] || '?'}${l[0][0] % 4 + 1}局 ${l[0][1]}本場</option>`).join('');
                ks.hidden = OBJ.log.length < 2;
                $('#srccard').hidden = true;
                loadKyoku(0);
            }
            function loadKyoku(i) {
                KI = i;
                K = JSON.parse(JSON.stringify(OBJ.log[i]));
                META = {};
                for (const key of Object.keys(OBJ))
                    if (key !== 'log')
                        META[key] = JSON.parse(JSON.stringify(OBJ[key]));
                me = MYSEAT;
                sel = null;
                simulate();
                $('#edit').hidden = false;
                pi = 0;
                setMe(MYSEAT, false);
            }
            function setMe(q, last, ptr) {
                me = q;
                sel = null;
                myPts = SIM.points.filter(p => p.p === q);
                if (ptr !== undefined && myPts.length) {
                    let k = 0
                      , best = Infinity;
                    myPts.forEach( (p, i) => {
                        const d = Math.abs(p.ptr - ptr);
                        if (d < best) {
                            best = d;
                            k = i;
                        }
                    }
                    );
                    pi = k;
                } else
                    pi = last ? Math.max(0, myPts.length - 1) : Math.min(pi, Math.max(0, myPts.length - 1));
                renderStructure();
            }
            function changeKyoku(nk) {
                const ok = K[0][0]
                  , r = ((nk % 4) - (ok % 4) + 4) % 4;
                if (r) {
                    const K2 = K.slice();
                    K2[1] = [0, 0, 0, 0];
                    for (let s = 0; s < 4; s++) {
                        const d = (s + r) % 4;
                        for (let j = 0; j < 3; j++)
                            K2[4 + 3 * d + j] = K[4 + 3 * s + j];
                        K2[1][d] = K[1][s];
                    }
                    K = K2;
                    for (const key of Object.keys(META)) {
                        if (Array.isArray(META[key]) && META[key].length === 4) {
                            const a = META[key].slice();
                            for (let s = 0; s < 4; s++)
                                a[(s + r) % 4] = META[key][s];
                            META[key] = a;
                        }
                    }
                    me = (me + r) % 4;
                }
                K[0] = K[0].slice();
                K[0][0] = nk;
                sel = null;
                simulate();
                myPts = SIM.points.filter(p => p.p === me);
                pi = Math.min(pi, Math.max(0, myPts.length - 1));
                renderStructure();
            }

            function markSel(el) {
                document.querySelectorAll('#board .sel').forEach(x => x.classList.remove('sel'));
                if (el)
                    el.classList.add('sel');
            }
            function selOff() {
                sel = null;
                markSel(null);
                renderPal();
            }
            /* ---------- イベント ---------- */
            $('#load').onclick = loadText;
            $('#ksel').onchange = e => loadKyoku(+e.target.value);
            $('#reset').onclick = () => {
                if (OBJ && confirm('編集内容をすべて元に戻します。よろしいですか？')) {
                    const keep = me
                      , keepPi = pi;
                    loadKyoku(KI);
                    pi = keepPi;
                    setMe(keep, false);
                }
            }
            ;
            $('#psel').onchange = e => {
                pi = +e.target.value;
                sel = null;
                renderScoresUI();
                renderAll();
            }
            ;
            $('#prev').onclick = () => {
                if (pi > 0) {
                    pi--;
                    $('#psel').value = pi;
                    sel = null;
                    renderScoresUI();
                    renderAll();
                }
            }
            ;
            $('#next').onclick = () => {
                if (pi < myPts.length - 1) {
                    pi++;
                    $('#psel').value = pi;
                    sel = null;
                    renderScoresUI();
                    renderAll();
                }
            }
            ;
            $('#ksel2').onchange = e => changeKyoku(+e.target.value);
            $('#honba').oninput = e => {
                K[0] = K[0].slice();
                K[0][1] = Math.max(0, +e.target.value || 0);
                renderAll();
            }
            ;
            $('#kyotaku').oninput = e => {
                K[0] = K[0].slice();
                K[0][2] = Math.max(0, +e.target.value || 0);
                renderAll();
            }
            ;
            $('#scores').oninput = e => {
                const i = e.target.closest('input');
                if (!i)
                    return;
                const pt = cur()
                  , q = +i.dataset.q;
                K[1][q] = Math.round(+i.value || 0) * 100 + 1000 * riichiCount(q, pt);
                renderBoard();
                renderOut();
            }
            ;
            $('#scores').onchange = e => {
                const i = e.target.closest('input');
                if (i)
                    i.value = Math.round(+i.value || 0);
            }
            ;
            $('#board').onclick = e => {
                const el = e.target.closest('[data-k]');
                if (!el)
                    return;
                const pt = cur();
                let n = null;
                if (el.dataset.k === 'h')
                    n = {
                        k: 'h',
                        inst: pt.hand[+el.dataset.n]
                    };
                else if (el.dataset.k === 'r') {
                    const q = +el.dataset.q;
                    n = {
                        k: 'r',
                        q,
                        e: SIM.P[q].river[+el.dataset.j]
                    };
                } else
                    n = {
                        k: 'd',
                        i: +el.dataset.i
                    };
                const same = sel && sel.k === n.k && ((n.k === 'h' && sel.inst === n.inst) || (n.k === 'r' && sel.e === n.e) || (n.k === 'd' && sel.i === n.i));
                sel = same ? null : n;
                markSel(sel ? el : null);
                renderPal();
            }
            ;
            $('#pal').onclick = e => {
                if (e.target.closest('#cancelsel')) {
                    selOff();
                    return;
                }
                if (e.target.closest('#rtog')) {
                    toggleRiichi(sel.e);
                    renderScoresUI();
                    renderAll();
                    return;
                }
                const b = e.target.closest('.pb');
                if (!b || !sel)
                    return;
                const v = +b.dataset.v;
                if (sel.k === 'h')
                    setInst(sel.inst, v);
                else if (sel.k === 'r')
                    setInst(sel.e.inst, v);
                else
                    K[2][sel.i] = v;
                sel = null;
                renderAll();
            }
            ;
            document.addEventListener('click', e => {
                if (!sel)
                    return;
                if (e.target.closest('#pal,[data-k]'))
                    return;
                selOff();
            }
            );
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && sel) {
                    selOff();
                }
            }
            );
            window.addEventListener('resize', placePal);
            const _renderBoard = renderBoard;
            renderBoard = function() {
                const bar = $('#tbar')
                  , col = $('#boardcol');
                if (bar.parentNode !== col)
                    col.appendChild(bar);
                _renderBoard();
                const tb = $('#board .tb');
                if (tb)
                    tb.prepend(bar);
            }
            ;
            $('#kclose').onclick = () => {
                $('#kdet').open = false;
            }
            ;
            $('#copy').onclick = async () => {
                if (!scoreOk())
                    return;
                const txt = buildExport();
                try {
                    await navigator.clipboard.writeText(txt);
                } catch (err) {
                    const a = document.createElement('textarea');
                    a.value = txt;
                    document.body.appendChild(a);
                    a.select();
                    document.execCommand('copy');
                    a.remove();
                }
                $('#copy').classList.add('done');
                setTimeout( () => $('#copy').classList.remove('done'), 1200);
            }
            ;
        </script>
    </body>
</html>
